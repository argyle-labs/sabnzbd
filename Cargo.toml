[package]
name = "sabnzbd"
version = "0.1.0"
edition = "2021"
description = "SABnzbd Usenet (NZB) client — orca service-backend"

[package.metadata.orca]
category = "downloads"

[lib]
name = "sabnzbd"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "sabnzbd"
path = "src/main.rs"

# Registers a ServiceBackend plus the `sabnzbd.*` tools over the orca socket
# and reaches the whole orca system through plugin-toolkit alone.
[dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "http"] }

[dev-dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "http"] }
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
wiremock = "0.6"

[lints.clippy]
let_underscore_must_use = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
